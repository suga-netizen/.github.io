<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrowthPoint｜フォローアップ</title>

<!-- Fonts: Noto Sans JP (UI) / Lato (数字) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">

<!-- Icons -->
<script src="https://unpkg.com/lucide@latest"></script>
<!-- Charts -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
/* =========================================================
   GrowthPoint デザイントークン（design-system.md §2 準拠）
   ========================================================= */
:root{
  /* base */
  --black:#000000; --dark-gray:#454545; --gray:#666666; --placeholder:#B1B1B1;
  --border:#D1D1D1; --disable:#F1F1F1; --white:#FFFFFF;
  /* brand (purple) */
  --primary:#5D3CFF; --primary-focus:#3E2DD5; --vivid-violet:#9D3CFF;
  --middle-violet:#E5E4FF; --light-violet:#EFEFFF; --bg-violet:#F8F8FC;
  /* semantic */
  --success:#07C847; --bg-green:#EAFFF1; --attention:#FFCC53;
  --caution:#FFB20C; --bg-caution:#FFFDED; --error:#F70A0A; --bg-red:#FFEFEF;
  --error-focus:#D10A0A; --orange:#FF9012;
  /* content type (研修=紫) */
  --train-bg:#F1E6FF; --train-fg:#8231E6;
  /* radius */
  --r-xs:2px; --r-sm:4px; --r-md:8px; --r-lg:16px; --r-pill:999px;
  /* shadow */
  --sh-sm:0 1px 2px rgba(0,0,0,.08); --sh-md:0 2px 6px rgba(0,0,0,.12);
  --sh-lg:0 4px 12px rgba(0,0,0,.18); --sh-menu:0 0 8px rgba(167,193,244,.25);
  --sh-menu-active:0 0 8px rgba(56,42,255,.5);
  /* spacing */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:24px; --s6:32px;
}

*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{
  font-family:'Noto Sans JP',sans-serif;
  background:var(--bg-violet);
  color:var(--dark-gray);
  font-size:16px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
.num{font-family:'Lato',sans-serif;}
button{font-family:inherit;cursor:pointer;}
a{color:var(--primary);text-decoration:none;}
.hidden{display:none !important;}

/* =========================================================
   レイアウトシェル（左ナビ240 + ヘッダー + メイン）
   ========================================================= */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh;}

/* --- サイドナビ --- */
.sidenav{
  position:sticky;top:0;height:100vh;background:var(--white);
  box-shadow:var(--sh-menu);display:flex;flex-direction:column;
  padding:var(--s5) var(--s3);gap:var(--s2);overflow-y:auto;z-index:20;
}
.brand{display:flex;align-items:center;gap:var(--s2);padding:0 var(--s2) var(--s4);}
.brand-logo{width:28px;height:28px;border-radius:var(--r-md);
  background:linear-gradient(135deg,var(--primary),var(--vivid-violet));
  display:flex;align-items:center;justify-content:center;color:#fff;}
.brand-name{font-weight:700;color:var(--black);font-size:18px;letter-spacing:.02em;}
.nav-section{font-size:12px;color:var(--placeholder);padding:var(--s3) var(--s2) var(--s1);font-weight:700;}
.nav-item{display:flex;align-items:center;gap:var(--s3);padding:0 var(--s3);height:48px;
  border-radius:var(--r-md);color:var(--dark-gray);font-size:14px;font-weight:500;
  transition:background .15s,color .15s;white-space:nowrap;}
.nav-item:hover{background:var(--bg-violet);}
.nav-item.active{background:var(--primary);color:#fff;box-shadow:var(--sh-menu-active);}
.nav-item.active svg{color:#fff;}
.nav-item svg{width:20px;height:20px;color:var(--gray);flex-shrink:0;}
.nav-item.active svg{color:#fff;}
.nav-spacer{flex-grow:1;}

/* --- メイン領域 --- */
.main-wrap{display:flex;flex-direction:column;min-width:0;}
.header{
  position:sticky;top:0;z-index:10;background:var(--bg-violet);
  display:flex;align-items:center;justify-content:space-between;
  padding:var(--s4) var(--s6);gap:var(--s4);
}
.breadcrumb{display:flex;align-items:center;gap:var(--s2);font-size:14px;flex-wrap:wrap;}
.breadcrumb a{color:var(--primary);}
.breadcrumb .sep{color:var(--placeholder);}
.breadcrumb .current{color:var(--gray);}
.header-right{display:flex;align-items:center;gap:var(--s4);}

/* デモ用ロール切替（モック専用コントロール） */
.demo-switch{display:flex;align-items:center;gap:var(--s2);background:var(--white);
  border:1px solid var(--border);border-radius:var(--r-pill);padding:var(--s1);box-shadow:var(--sh-sm);}
.demo-switch .demo-label{font-size:11px;color:var(--placeholder);padding:0 var(--s2);font-weight:700;}
.demo-btn{display:flex;align-items:center;gap:var(--s1);padding:6px var(--s3);border:none;background:transparent;
  border-radius:var(--r-pill);font-size:13px;font-weight:700;color:var(--gray);transition:all .15s;}
.demo-btn svg{width:15px;height:15px;}
.demo-btn.active{background:var(--primary);color:#fff;}
.profile{display:flex;align-items:center;gap:var(--s2);}
.avatar{width:36px;height:36px;border-radius:var(--r-pill);background:var(--middle-violet);
  color:var(--primary);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;}

.main{padding:var(--s5) var(--s6) var(--s6);display:flex;flex-direction:column;gap:var(--s6);}

/* =========================================================
   コアコンポーネント
   ========================================================= */
/* 見出し */
.h1{font-size:24px;font-weight:700;color:var(--black);line-height:1.3;}
.h1 .sub{display:block;font-size:15px;font-weight:500;color:var(--gray);margin-top:var(--s2);}
.h2{font-size:20px;font-weight:700;color:var(--black);line-height:1.3;}
.h3{font-size:17px;font-weight:700;color:var(--black);}
.section-label{font-size:13px;font-weight:700;color:var(--placeholder);letter-spacing:.04em;}

/* パネル（白カード） */
.panel{background:var(--white);border-radius:var(--r-md);box-shadow:var(--sh-sm);
  padding:var(--s6);display:flex;flex-direction:column;gap:var(--s5);}
.panel.flat{box-shadow:none;border:1px solid var(--border);}
.panel-head{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);
  padding-bottom:var(--s4);border-bottom:2px solid var(--disable);}
.panel-head.no-border{border-bottom:none;padding-bottom:0;}

/* ボタン */
.btn{display:inline-flex;align-items:center;gap:var(--s2);padding:10px var(--s5);
  border-radius:var(--r-md);font-size:15px;font-weight:600;border:1px solid transparent;
  transition:all .15s;white-space:nowrap;}
.btn svg{width:17px;height:17px;}
.btn:active{transform:translateY(1px);}
.btn-primary{background:var(--primary);color:#fff;}
.btn-primary:hover{background:var(--primary-focus);box-shadow:var(--sh-sm);}
.btn-secondary{background:#fff;color:var(--primary);border-color:var(--primary);}
.btn-secondary:hover{background:var(--light-violet);}
.btn-tertiary{background:var(--disable);color:var(--gray);border-color:var(--border);}
.btn-tertiary:hover{background:#e9e9ef;}
.btn-text{background:transparent;color:var(--primary);padding:6px var(--s2);}
.btn-text:hover{background:var(--light-violet);}
.btn-danger{background:var(--error);color:#fff;}
.btn-mini{padding:6px var(--s3);font-size:13px;}
.btn-lg{padding:14px var(--s6);font-size:16px;font-weight:700;letter-spacing:.01em;}
.btn:disabled{background:var(--disable);color:var(--placeholder);border-color:var(--border);cursor:not-allowed;}

/* タグ / バッジ / ステータスピル */
.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:var(--r-pill);
  font-size:12px;font-weight:700;line-height:1.4;}
.tag svg{width:12px;height:12px;}
.tag-info{background:var(--middle-violet);color:var(--primary);}
.tag-success{background:var(--bg-green);color:var(--success);}
.tag-warning{background:var(--bg-caution);color:var(--caution);}
.tag-error{background:var(--bg-red);color:var(--error);}
.tag-ghost{background:var(--disable);color:var(--gray);}
.tag-train{background:var(--train-bg);color:var(--train-fg);}
.tag-required{background:var(--error);color:#fff;font-size:11px;padding:2px 8px;}
.tag-optional{background:var(--disable);color:var(--gray);font-size:11px;padding:2px 8px;}

/* フィールド */
.field{display:flex;flex-direction:column;gap:var(--s2);}
.field-label{display:flex;align-items:center;justify-content:space-between;gap:var(--s2);
  font-size:15px;font-weight:700;color:var(--dark-gray);}
.field-label .lbl{display:flex;align-items:center;gap:var(--s2);}
.input,.textarea,.select{width:100%;min-height:48px;border:1.5px solid var(--border);border-radius:var(--r-md);
  background:#fff;padding:12px var(--s4);font-size:15px;font-family:inherit;color:var(--dark-gray);outline:none;transition:box-shadow .15s,border-color .15s;}
.textarea{min-height:auto;resize:vertical;line-height:1.6;}
.input:focus,.textarea:focus,.select:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--light-violet);}
.input::placeholder,.textarea::placeholder{color:var(--placeholder);}
.hint{font-size:13px;color:var(--placeholder);}

/* セグメント選択（ラジオ的なボタン群） */
.seg{display:grid;gap:var(--s2);}
.seg-2{grid-template-columns:1fr 1fr;}
.seg-3{grid-template-columns:1fr 1fr 1fr;}
.seg-btn{display:flex;align-items:center;justify-content:center;gap:var(--s2);padding:13px var(--s4);
  border:1.5px solid var(--border);background:#fff;border-radius:var(--r-md);font-size:15px;font-weight:700;color:var(--gray);transition:all .15s;}
.seg-btn:hover{border-color:var(--primary);background:var(--bg-violet);}
.seg-btn.active{border-color:var(--primary);background:var(--light-violet);color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary);}

/* ステッパー */
.stepper{display:flex;align-items:center;gap:0;}
.step{display:flex;align-items:center;gap:var(--s2);}
.step-dot{width:28px;height:28px;border-radius:var(--r-pill);background:var(--disable);color:var(--placeholder);
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;}
.step.done .step-dot{background:var(--primary);color:#fff;}
.step.current .step-dot{background:var(--primary);color:#fff;box-shadow:var(--sh-menu-active);}
.step-label{font-size:13px;font-weight:700;color:var(--gray);}
.step.current .step-label,.step.done .step-label{color:var(--primary);}
.step-line{width:40px;height:2px;background:var(--border);margin:0 var(--s2);}
.step.done + .step-line,.step-line.done{background:var(--primary);}

/* テーブル */
.table-wrap{overflow-x:auto;border-radius:var(--r-md);}
table.tbl{width:100%;border-collapse:collapse;font-size:15px;}
table.tbl thead th{background:var(--bg-violet);color:var(--gray);font-weight:700;font-size:13px;text-align:center;
  padding:var(--s3) var(--s4);border-bottom:2px solid var(--border);white-space:nowrap;letter-spacing:.04em;}
table.tbl thead th.left{text-align:left;}
table.tbl tbody td{padding:var(--s4) var(--s4);border-bottom:1px solid var(--disable);text-align:center;color:var(--dark-gray);font-size:14px;}
table.tbl tbody td.left{text-align:left;}
table.tbl tbody tr.clickable{cursor:pointer;transition:background .15s;}
table.tbl tbody tr.clickable:hover{background:var(--light-violet);}
table.tbl tbody tr.clickable:hover td{color:var(--black);}
.user-cell{display:flex;align-items:center;gap:var(--s3);text-align:left;}
.user-cell .ua{width:36px;height:36px;border-radius:var(--r-pill);background:var(--primary);color:#fff;
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0;}
.user-cell .un{font-weight:700;color:var(--black);font-size:15px;}
.user-cell .um{font-size:13px;color:var(--placeholder);margin-top:2px;}

/* カードグリッド */
.card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(380px,1fr));gap:var(--s5);}
@media(max-width:600px){.card-grid{grid-template-columns:1fr;}}

/* 案件カード */
.fu-card{background:#fff;border:1.5px solid var(--border);border-radius:var(--r-md);padding:var(--s6);
  display:flex;flex-direction:column;gap:var(--s4);cursor:pointer;transition:box-shadow .15s,border-color .15s,transform .1s;}
.fu-card:hover{box-shadow:var(--sh-md);border-color:var(--primary);transform:translateY(-3px);}
.fu-card .fu-metrics{display:flex;gap:var(--s5);margin-top:var(--s3);padding-top:var(--s3);border-top:1px solid var(--disable);}
.fu-metric .v{font-size:28px;font-weight:700;color:var(--black);font-family:'Lato',sans-serif;line-height:1.1;}
.fu-metric .l{font-size:12px;color:var(--gray);margin-top:4px;}

/* 統計カウンタ */
.stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s4);}
.stat-box{border:1px solid var(--border);border-radius:var(--r-md);padding:var(--s5);text-align:center;}
.stat-box .v{font-size:36px;font-weight:700;font-family:'Lato',sans-serif;color:var(--black);line-height:1.1;}
.stat-box .l{font-size:13px;color:var(--gray);margin-top:var(--s2);}

/* スコアリング円 */
.score-ring{width:172px;height:172px;border-radius:var(--r-pill);display:flex;align-items:center;justify-content:center;
  background:conic-gradient(var(--primary) var(--score-deg,0deg),var(--disable) 0deg);margin:0 auto;}
.score-ring-inner{width:142px;height:142px;border-radius:var(--r-pill);background:#fff;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:2px;}
.score-ring-inner .v{font-size:48px;font-weight:700;font-family:'Lato',sans-serif;color:var(--black);line-height:1;}
.score-ring-inner .u{font-size:13px;color:var(--placeholder);}

/* 範囲スライダー */
input[type=range]{width:100%;accent-color:var(--primary);height:6px;}

/* プレースホルダ（空状態） */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s4);
  padding:var(--s6);text-align:center;}
.empty-icon{width:72px;height:72px;border-radius:var(--r-pill);background:var(--light-violet);color:var(--primary);
  display:flex;align-items:center;justify-content:center;}
.empty h3{font-size:16px;font-weight:700;color:var(--black);margin:0;}
.empty p{font-size:14px;color:var(--gray);margin:0;max-width:460px;}

/* 進捗バー */
.pbar{width:100%;height:10px;background:var(--disable);border-radius:var(--r-pill);overflow:hidden;}
.pbar > i{display:block;height:100%;background:var(--primary);border-radius:var(--r-pill);transition:width .5s;}

/* AI プレースホルダ枠（Phase6で実API差し替え予定） */
.ai-box{border:1.5px dashed var(--vivid-violet);background:var(--light-violet);border-radius:var(--r-md);
  padding:var(--s5);display:flex;flex-direction:column;gap:var(--s3);}
.ai-box .ai-head{display:flex;align-items:center;gap:var(--s2);font-size:14px;font-weight:700;color:var(--vivid-violet);}
.ai-box .ai-head svg{width:16px;height:16px;}
.ai-pending{font-size:12px;color:var(--vivid-violet);background:#fff;border-radius:var(--r-pill);padding:3px 10px;font-weight:700;}

/* 成長（ゲーミフィケーション） */
.growth{display:flex;flex-direction:column;align-items:center;gap:var(--s4);padding:var(--s3) 0;}
.growth-stage-name{font-size:16px;font-weight:700;color:var(--success);}
.growth-track{display:flex;align-items:center;gap:var(--s3);margin-top:var(--s2);}
.growth-track .gdot{width:14px;height:14px;border-radius:var(--r-pill);background:var(--disable);transition:background .3s;}
.growth-track .gdot.on{background:var(--success);box-shadow:0 0 0 3px var(--bg-green);}

/* トースト */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(120%);
  background:var(--black);color:#fff;font-size:14px;padding:12px 20px;border-radius:var(--r-md);
  box-shadow:var(--sh-lg);display:flex;align-items:center;gap:var(--s2);z-index:100;
  opacity:0;transition:transform .3s cubic-bezier(.16,1,.3,1),opacity .3s;max-width:90vw;}
.toast svg{width:16px;height:16px;}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1;}
.toast.success svg{color:var(--success);}
.toast.error{background:var(--error);}

/* モーダル */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:90;display:flex;
  align-items:flex-start;justify-content:center;padding-top:5vh;opacity:0;transition:opacity .25s;}
.modal-overlay.show{opacity:1;}
.modal{background:#fff;border-radius:var(--r-md);box-shadow:var(--sh-lg);width:min(960px,92vw);max-height:90vh;
  display:flex;flex-direction:column;overflow:hidden;transform:scale(.97);transition:transform .25s;}
.modal-overlay.show .modal{transform:scale(1);}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:var(--s4) var(--s5);border-bottom:1px solid var(--disable);}
.modal-body{padding:var(--s5);overflow:auto;}
.modal-foot{display:flex;justify-content:flex-end;gap:var(--s3);padding:var(--s4) var(--s5);border-top:1px solid var(--disable);}
.icon-btn{width:32px;height:32px;border-radius:var(--r-md);border:none;background:transparent;color:var(--gray);
  display:flex;align-items:center;justify-content:center;}
.icon-btn:hover{background:var(--disable);}

/* Excelプレビュー風 */
.xls{border-collapse:collapse;width:100%;font-size:12px;font-family:'Roboto Mono',monospace;}
.xls th,.xls td{border:1px solid var(--border);padding:6px 8px;}
.xls thead th{background:var(--disable);text-align:center;color:var(--gray);}
.xls .xls-title{background:var(--success);color:#fff;font-weight:700;text-align:left;}
.xls .xls-band{background:var(--disable);font-weight:700;}

/* 汎用 */
.row{display:flex;align-items:center;gap:var(--s3);}
.row-between{display:flex;align-items:center;justify-content:space-between;gap:var(--s3);}
.col{display:flex;flex-direction:column;gap:var(--s3);}
.gap2{gap:var(--s2);} .gap4{gap:var(--s4);} .gap5{gap:var(--s5);}
.wrap{flex-wrap:wrap;}
.grow{flex-grow:1;}
.muted{color:var(--gray);} .small{font-size:13px;} .sm{font-size:15px;}
.bold{font-weight:700;} .center{text-align:center;}
.mt2{margin-top:var(--s2);} .mt4{margin-top:var(--s4);}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:var(--s5);}
.grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s5);}
@media(max-width:760px){.grid-2,.grid-3{grid-template-columns:1fr;}}
.chart-box{position:relative;height:280px;width:100%;}
.divider{height:1px;background:var(--disable);}

/* ライト伴走モード（グリーン系アクセント） */
.mode-light .tag-info{background:var(--bg-green);color:var(--success);}
.mode-light .tag-train{background:#D4F7E3;color:#059A38;}
.mode-light .btn-primary{background:var(--success);}
.mode-light .btn-primary:hover{background:#05A03A;box-shadow:var(--sh-sm);}
.mode-light .btn-secondary{color:var(--success);border-color:var(--success);}
.mode-light .btn-secondary:hover{background:var(--bg-green);}
.mode-light .pbar>i{background:var(--success);}
.mode-light .ai-box{background:#EDFFF5;border-color:var(--success);}
.mode-light .ai-box .ai-head{color:var(--success);}
.mode-light .ai-pending{color:var(--success);}
.mode-light .seg-btn.active{border-color:var(--success);background:var(--bg-green);color:var(--success);box-shadow:inset 0 0 0 1.5px var(--success);}
.mode-light input[type=range]{accent-color:var(--success);}
.mode-light .score-ring{background:conic-gradient(var(--success) var(--score-deg,0deg),var(--disable) 0deg);}
.mode-light .panel-head{border-bottom-color:rgba(7,200,71,.25);}
.mode-light .growth-stage-name{color:var(--success);}
.mode-light .growth-track .gdot.on{background:var(--success);box-shadow:0 0 0 3px var(--bg-green);}
.mode-light .input:focus,.mode-light .textarea:focus{border-color:var(--success);box-shadow:0 0 0 3px var(--bg-green);}
</style>
</head>
<body>

<div class="shell">

  <!-- ============ 左サイドナビ ============ -->
  <nav class="sidenav">
    <div class="brand">
      <div class="brand-logo"><i data-lucide="trending-up"></i></div>
      <span class="brand-name">GrowthPoint</span>
    </div>
    <a class="nav-item"><i data-lucide="school"></i><span>学習する</span></a>
    <a class="nav-item"><i data-lucide="file-edit"></i><span>教育計画を立てる</span></a>
